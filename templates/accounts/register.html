{% extends 'base.html' %}{% block title %}Register | GreenHarvest{% endblock %}{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><div class="form-card"><h2 class="text-center mb-4">Create GreenHarvest Account</h2><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-success w-100">Register</button></form><p class="text-center mt-3 mb-0">Already registered? <a href="{% url 'login' %}">Login</a></p></div></div></div></div>
{% endblock %}
