{% extends 'base.html' %}{% block title %}Order Success | GreenHarvest{% endblock %}{% block content %}
<div class="container py-5"><div class="success-card text-center"><i class="bi bi-check-circle-fill display-2 text-success"></i><h1 class="mt-3">Order Placed Successfully</h1><p class="text-muted">Order Number: <strong>{{ order.order_number }}</strong></p><h3 class="text-success">₹{{ order.total_amount }}</h3><p>Payment: {{ order.get_payment_method_display }}</p><a class="btn btn-success" href="{% url 'order_detail' order.id %}">View Order</a> <a class="btn btn-outline-success" href="{% url 'product_list' %}">Continue Shopping</a></div></div>
{% endblock %}
